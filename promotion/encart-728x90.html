<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>OpenLoto</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0f5c63}
a{display:flex;align-items:center;gap:14px;width:100%;max-width:728px;height:90px;padding:0 16px;color:#fff;text-decoration:none;background:linear-gradient(100deg,#0b4a50,#147a83);overflow:hidden;position:relative}
a:focus-visible{outline:3px solid #f5a300;outline-offset:-3px}
.logo{height:46px;flex:none}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15px;white-space:nowrap}
.txt span{opacity:.92;font-size:13px}
.boules{display:flex;gap:6px;flex:none}
.b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#2b1d00;background:radial-gradient(circle at 36% 30%,#ffd98a,#f5a300 55%,#b86a00);box-shadow:0 2px 4px rgba(0,0,0,.3);opacity:0;transform:translateY(-20px) scale(.6);animation:pop 10s infinite}
.b:nth-child(2){animation-delay:.6s}.b:nth-child(3){animation-delay:1.2s}.b:nth-child(4){animation-delay:1.8s}
@keyframes pop{0%{opacity:0;transform:translateY(-20px) scale(.6)}6%{opacity:1;transform:translateY(0) scale(1.1)}9%{transform:scale(1)}85%{opacity:1}95%,100%{opacity:0}}
.cta{flex:none;background:#f5a300;color:#2b1d00;font-weight:800;padding:9px 16px;border-radius:10px}
@media (max-width:600px){.boules{display:none}.txt span{display:none}}
@media (prefers-reduced-motion:reduce){.b{animation:none;opacity:1;transform:none}}
</style></head><body>
<a href="https://openloto.org/" target="_blank" rel="noopener" aria-label="OpenLoto : logiciel de loto gratuit pour les associations">
  <img class="logo" src="https://openloto.org/docs/logo/openloto-logo-blanc.svg" alt="OpenLoto">
  <span class="txt"><b>Le loto de votre association, en direct</b><span>Gratuit, libre, sans installation ni publicité</span></span>
  <span class="boules" aria-hidden="true"><i class="b">7</i><i class="b">23</i><i class="b">48</i><i class="b">90</i></span>
  <span class="cta">Découvrir</span>
</a>
</body></html>
