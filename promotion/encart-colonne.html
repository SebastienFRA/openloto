<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>OpenLoto</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0a2a30}
.w{display:flex;color:#fff;text-decoration:none;overflow:hidden;position:relative;background:radial-gradient(120% 140% at 50% 0%,#12424a,#0a2a30)}
.w:focus-visible{outline:3px solid #f5a300;outline-offset:-3px}
.t b{display:block}.t .s{opacity:.9}
.tirage{display:flex;flex:none}
.main{border-radius:50%;border:3px solid #fff;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.22),transparent 52%),var(--c);box-shadow:0 0 0 2px #0a2a30,0 6px 14px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;justify-content:center}
.ball{font-style:normal;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.5),transparent 48%),var(--c);box-shadow:inset -2px -3px 6px rgba(0,0,0,.28),0 3px 6px rgba(0,0,0,.35)}
.n{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif;font-weight:700;line-height:1;color:#fff}
.dark{color:#14213d}
.c{flex:none;background:#f5a300;color:#2b1d00;font-weight:800;border-radius:10px;white-space:nowrap}
.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:.2}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

.w{width:160px;height:600px;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px 10px;text-align:center}
.logo{width:128px}.t b{font-size:18px;line-height:1.3}.t .s{font-size:13px;margin-top:8px;line-height:1.4}
.tirage{flex-direction:column;align-items:center;gap:12px}
.main{width:104px;height:104px}.main .n{font-size:44px}.row{gap:5px}.ball .n{font-size:calc(var(--s)*.46)}
.c{padding:9px 14px;font-size:14px}</style></head><body>
